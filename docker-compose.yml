services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: monorepo_api
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
    networks:
      - monorepo_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - PUBLIC_API_BASE=https://api.dashboard.lucasramos.uy/api
    container_name: monorepo_web
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
    networks:
      - monorepo_network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  monorepo_network:
    driver: bridge
