# Actualizaciones automáticas de dependencias.
# Una vez por semana, agrupadas en pocos PRs y siempre contra dev.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/" # bun.lock está en la raíz y cubre todo el monorepo
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Montevideo"
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: ["minor", "patch"]
    ignore:
      # Los saltos mayores (Astro 7, React 19, etc.) se hacen a mano en su propio PR
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Montevideo"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # Las actualizaciones de seguridad se hacen por directorio y no heredan la
  # entrada de la raíz: cada workspace con package.json necesita su propia
  # entrada bun, si no Dependabot cae en npm_and_yarn y no puede con bun.lock.
  - package-ecosystem: "bun"
    directory: "/apps/web"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Montevideo"
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "bun"
    directory: "/apps/api"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Montevideo"
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "bun"
    directory: "/packages/shared-types"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "America/Montevideo"
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
