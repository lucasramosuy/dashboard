name: Deploy

# Publica web + API (un solo Worker) en lucasramos.uy/dashboard cada vez que se mergea a prod.
on:
  push:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  BUN_VERSION: "1.4.2"

jobs:
  deploy:
    name: Migrar Turso y publicar Worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # CREATE TABLE IF NOT EXISTS + columnas nuevas; no borra datos
      - name: Migrar base (Turso)
        working-directory: apps/api
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: bun run migrate

      - name: Build web
        working-directory: apps/web
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Clave pública del widget de Turnstile (va en el HTML, no es secreta)
          PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFC2axo0bAMoz4Xc
        run: bun run build

      # Sube los secrets del Worker y publica (rutas y cron salen de wrangler.jsonc)
      - name: Deploy a Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          packageManager: bun
          wranglerVersion: "4.139.0"
          command: deploy
          secrets: |
            TURSO_DATABASE_URL
            TURSO_AUTH_TOKEN
            BETTER_AUTH_SECRET
            ADMIN_EMAILS
            TELEGRAM_BOT_TOKEN
            TELEGRAM_CHAT_ID
            TURNSTILE_SECRET_KEY
            SMOKE_KEY
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SMOKE_KEY: ${{ secrets.SMOKE_KEY }}

      # Si algo quedó roto después de publicar, el run queda en rojo y GitHub avisa por mail
      - name: Smoke test contra producción
        env:
          SMOKE_KEY: ${{ secrets.SMOKE_KEY }}
        run: bash scripts/smoke.sh https://lucasramos.uy/dashboard

      # Aviso por Telegram si cualquier paso anterior falló (no depende del checkout)
      - name: Avisar por Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHAT: el deploy a producción
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          curl -s -o /dev/null --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Falló ${WHAT} en el dashboard: ${RUN_URL}" \
            -d disable_web_page_preview=true || true
